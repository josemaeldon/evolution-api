<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Copiar Pix</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      body { margin: 0; background: #f5f7f6; color: #17211d; }
      main { box-sizing: border-box; max-width: 540px; margin: 0 auto; padding: 48px 20px; }
      article { background: white; border: 1px solid #e3e9e6; border-radius: 20px; padding: 24px; box-shadow: 0 8px 32px #17211d0d; }
      h1 { font-size: 1.6rem; margin: 0 0 12px; }
      p { line-height: 1.5; }
      #code { overflow-wrap: anywhere; background: #f5f7f6; border-radius: 12px; padding: 16px; font-size: .85rem; line-height: 1.5; user-select: all; }
      button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #00a884; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { background: #9aa7a1; cursor: default; }
      button:focus-visible { outline: 3px solid #17211d; outline-offset: 3px; }
      #status { min-height: 1.5em; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>Pix Copia e Cola</h1>
        <p id="instruction">Toque no botão e cole o código na opção Pix Copia e Cola do seu banco.</p>
        <p id="code"></p>
        <button id="copy" type="button" disabled>Copiar Pix</button>
        <p id="status" role="status" aria-live="polite"></p>
      </article>
    </main>
    <script>
      const codeElement = document.getElementById('code');
      const button = document.getElementById('copy');
      const status = document.getElementById('status');
      const code = new URLSearchParams(location.hash.slice(1)).get('code') || '';
      const valid = code.length >= 50 && code.length <= 512 && code.startsWith('000201') && /6304[0-9A-F]{4}$/.test(code);

      if (valid) {
        codeElement.textContent = code;
        button.disabled = false;
      } else {
        document.getElementById('instruction').textContent = 'Código Pix não encontrado neste link.';
        codeElement.hidden = true;
      }

      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          status.textContent = 'Pix copiado. Cole no aplicativo do seu banco.';
        } catch {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(codeElement);
          selection.removeAllRanges();
          selection.addRange(range);
          status.textContent = 'Selecione “Copiar” no menu do aparelho para copiar o código.';
        }
      });
    </script>
  </body>
</html>
